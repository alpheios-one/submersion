name: Claude Code
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [labeled]
jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
          token: ${{ secrets.WORKFLOW_PAT }}
      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/submersion-app/submersion.git || true
          git fetch upstream main
      - name: Read Flutter version
        id: flutter-ver
        run: echo "version=$(cat .github/flutter-version.txt)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-ver.outputs.version }}
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Cache build_runner output
        uses: actions/cache@v4
        with:
          path: .dart_tool/build
          key: build-runner-${{ runner.os }}-${{ steps.flutter-ver.outputs.version }}-${{ hashFiles('**/pubspec.lock') }}-${{ github.sha }}
          restore-keys: |
            build-runner-${{ runner.os }}-${{ steps.flutter-ver.outputs.version }}-${{ hashFiles('**/pubspec.lock') }}-
      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "Bash(flutter pub get:*),Bash(flutter analyze:*),Bash(flutter test:*),Bash(dart format:*),Bash(dart run:*),Bash(dart:*),Bash(git fetch:*),Bash(git remote:*),Bash(git merge:*),Bash(git rebase:*),Bash(git checkout:*),Bash(git switch:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git push:*),Bash(git rm:*),Bash(gh pr:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue close:*),WebFetch(domain:github.com)"

  claude-phase1:
    if: github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'auto-pruefen'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FORK_REPO: alpheios-one/submersion
      UPSTREAM_REPO: submersion-app/submersion
      ISSUE_NUM: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_PAT }}

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/${UPSTREAM_REPO}.git || true
          git fetch upstream main

      # --- Ast 2: Idempotenz-Guard ---
      - name: Prüfen ob bereits ein PR für dieses Issue existiert
        id: idempotenz
        run: |
          EXISTING=$(gh pr list --repo "$FORK_REPO" --state open --json number,body \
            --jq ".[] | select(.body != null and (.body | test(\"Bezug: #${ISSUE_NUM}([^0-9]|\$)\"))) | .number" \
            | head -1)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$ISSUE_NUM" --repo "$FORK_REPO" \
              --body "Hinweis: Es existiert bereits PR #${EXISTING} mit Bezug zu diesem Issue. Kein neuer Lauf gestartet. Label entfernt."
            gh issue edit "$ISSUE_NUM" --repo "$FORK_REPO" --remove-label "auto-pruefen"
            echo "weiter=false" >> "$GITHUB_OUTPUT"
          else
            echo "weiter=true" >> "$GITHUB_OUTPUT"
          fi

      # --- Ast 4: Link-Extraktion mit Fehlerbehandlung ---
      - name: Upstream-Link aus Fork-Issue-Titel extrahieren
        id: extraktion
        if: steps.idempotenz.outputs.weiter == 'true'
        run: |
          UPSTREAM_NUM=$(echo "$ISSUE_TITLE" | grep -oP "github\.com/${UPSTREAM_REPO}/issues/\K[0-9]+" | head -1)
          if [ -z "$UPSTREAM_NUM" ]; then
            gh issue comment "$ISSUE_NUM" --repo "$FORK_REPO" \
              --body "Fehler: Kein gültiger Link zu ${UPSTREAM_REPO} im Issue-Titel gefunden. Erwartetes Format: voller Titel = volle URL https://github.com/${UPSTREAM_REPO}/issues/<nummer>. Abgebrochen, Label entfernt."
            gh issue edit "$ISSUE_NUM" --repo "$FORK_REPO" --remove-label "auto-pruefen"
            echo "weiter=false" >> "$GITHUB_OUTPUT"
          else
            echo "weiter=true" >> "$GITHUB_OUTPUT"
            echo "upstream_num=$UPSTREAM_NUM" >> "$GITHUB_OUTPUT"
          fi

      # --- Ast 1: Cross-Repo-Read unauthentifiziert (umgeht Token-Scope-Risiko) ---
      # --- Ast 5: Kommentare mitlesen, nicht nur Body ---
      - name: Upstream-Issue öffentlich abrufen (kein Token nötig)
        id: upstream
        if: steps.idempotenz.outputs.weiter == 'true' && steps.extraktion.outputs.weiter == 'true'
        run: |
          NUM="${{ steps.extraktion.outputs.upstream_num }}"
          JSON=$(curl -s "https://api.github.com/repos/${UPSTREAM_REPO}/issues/${NUM}")
          if echo "$JSON" | jq -e '.message == "Not Found"' > /dev/null 2>&1; then
            gh issue comment "$ISSUE_NUM" --repo "$FORK_REPO" \
              --body "Fehler: Upstream-Issue #${NUM} nicht gefunden (404). Abgebrochen, Label entfernt."
            gh issue edit "$ISSUE_NUM" --repo "$FORK_REPO" --remove-label "auto-pruefen"
            echo "weiter=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TITLE=$(echo "$JSON" | jq -r '.title')
          BODY=$(echo "$JSON" | jq -r '.body // ""')
          TYP_ROH=$(echo "$JSON" | jq -r '(.type.name // .issue_type.name // "none")')
          COMMENTS_URL=$(echo "$JSON" | jq -r '.comments_url')
          COMMENTS=$(curl -s "$COMMENTS_URL" | jq -r '[.[].body] | join("\n---\n")' | head -c 3000)
          {
            echo "weiter=true"
            echo "upstream_num=${NUM}"
            echo "typ_roh=${TYP_ROH}"
            echo "title<<GHA_EOF_TITLE"
            echo "$TITLE"
            echo "GHA_EOF_TITLE"
            echo "body<<GHA_EOF_BODY"
            echo "$BODY"
            echo "GHA_EOF_BODY"
            echo "comments<<GHA_EOF_COMMENTS"
            echo "$COMMENTS"
            echo "GHA_EOF_COMMENTS"
          } >> "$GITHUB_OUTPUT"

      # --- Ast 6: Nur der Paraphrasierungs-Schritt geht an Claude, schlank, ohne Tools ---
      - uses: anthropics/claude-code-action@v1
        id: paraphrase
        if: steps.idempotenz.outputs.weiter == 'true' && steps.extraktion.outputs.weiter == 'true' && steps.upstream.outputs.weiter == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Upstream-Issue-Titel: ${{ steps.upstream.outputs.title }}
            Upstream-Issue-Type (roh): ${{ steps.upstream.outputs.typ_roh }}

            Upstream-Issue-Beschreibung:
            ${{ steps.upstream.outputs.body }}

            Kommentare (falls vorhanden):
            ${{ steps.upstream.outputs.comments }}

            Formuliere daraus in eigenen Worten (nicht wörtlich übernehmen):
            - titel: SEHR kurzer, prägnanter Titel, max. 60 Zeichen, KEIN vollständiger Satz,
              KEIN Nebensatz mit "damit"/"sodass"/"welches". Stil wie eine Zeitungsschlagzeile.
              Gutes Beispiel: "Brevet-Karten: Hochformat zu Querformat".
              Schlechtes Beispiel: "Darstellung der Tauchzertifikate von Hochkant- auf
              Querformat umstellen, damit die Kartenansicht dem realen Kreditkartenformat
              entspricht und die Liste vertikal statt horizontal gescrollt werden kann."
            - aufgabe: kurze Zusammenfassung in 1-2 vollständigen Sätzen, was umgesetzt werden
              soll (das darf länger sein als "titel" - dies kommt in die Issue-Beschreibung,
              nicht in den Titel)
            - kontext: Hintergrund und Problem aus dem Original-Issue, inklusive relevanter
              Präzisierungen aus den Kommentaren
            - typ: "fix" falls Issue-Type "Bug", "feature" falls Issue-Type "Feature",
              sonst "optimierung"
            - kurzbeschreibung: 3-5 Wörter, kleingeschrieben, mit Bindestrichen verbunden,
              geeignet für einen Git-Branch-Namen (z.B. "grid-stitching-mehrere-tiles")
          claude_args: |
            --allowedTools ""
            --json-schema '{"type":"object","properties":{"titel":{"type":"string","maxLength":60},"aufgabe":{"type":"string"},"kontext":{"type":"string"},"typ":{"type":"string","enum":["fix","feature","optimierung"]},"kurzbeschreibung":{"type":"string"}},"required":["titel","aufgabe","kontext","typ","kurzbeschreibung"]}'

      # --- Branch, Commit, Push: reines Bash, kein Grund für einen weiteren Claude-Aufruf ---
      - name: Branch erstellen, Platzhalter-Commit, pushen
        id: branch
        if: steps.idempotenz.outputs.weiter == 'true' && steps.extraktion.outputs.weiter == 'true' && steps.upstream.outputs.weiter == 'true'
        run: |
          RESULT='${{ steps.paraphrase.outputs.structured_output }}'
          TYP=$(echo "$RESULT" | jq -r '.typ')
          KURZ=$(echo "$RESULT" | jq -r '.kurzbeschreibung')
          NUM="${{ steps.extraktion.outputs.upstream_num }}"
          BRANCH="${TYP}/issue-${NUM}-${KURZ}"

          git checkout -b "$BRANCH" upstream/main
          git commit --allow-empty -m "Platzhalter für ${UPSTREAM_REPO}#${NUM}"
          git push origin "$BRANCH"

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      # --- Ast 1 (Fix): explizites --repo, da gh pr create in einem Fork sonst gegen Upstream öffnet ---
      # --- Verlinkung: "Bezug: #<nummer>" als reine Erwähnung, kein schliessendes Schlüsselwort ---
      - name: Platzhalter-PR im eigenen Fork öffnen
        id: pr
        if: steps.idempotenz.outputs.weiter == 'true' && steps.extraktion.outputs.weiter == 'true' && steps.upstream.outputs.weiter == 'true'
        run: |
          RESULT='${{ steps.paraphrase.outputs.structured_output }}'
          TITEL_KURZ=$(echo "$RESULT" | jq -r '.titel')
          AUFGABE=$(echo "$RESULT" | jq -r '.aufgabe')
          KONTEXT=$(echo "$RESULT" | jq -r '.kontext')
          NUM="${{ steps.extraktion.outputs.upstream_num }}"
          TITLE="${{ steps.upstream.outputs.title }}"

          cat > /tmp/pr_body.md << PRBODY_EOF
          **Bezug:** #${ISSUE_NUM}

          **Original-Issue:** ${TITLE} [${UPSTREAM_REPO}#${NUM}]

          **Aufgabe:**
          ${AUFGABE}

          **Kontext:**
          ${KONTEXT}

          ---

          ## Phase 2 – sobald bereit, diesen Abschnitt als neuen Kommentar posten:

          @claude bitte basierend auf Aufgabe und Kontext oben umsetzen.
          Entferne diesen Platzhalter-Abschnitt (ab "## Phase 2") aus der PR-Beschreibung, sobald
          du mit der Umsetzung beginnst, und ersetze ihn durch eine kurze Zusammenfassung deiner
          Änderungen.

          Vorgehen:
          - Bestehende Architektur/Datenstruktur analysieren, die für die Umsetzung relevant ist (betroffene Dateien, aktuelle Modellierung in DB/Repository)
          - Prüfen, ob der Branch Merge-Konflikte gegenüber upstream/main (${UPSTREAM_REPO}) hat - NICHT gegenüber dem Fork-main (origin/main), da dieser keine verlässliche Referenz ist. Falls ja: zuerst gegen upstream/main mergen und Konflikte lösen
          - Bestehende Code-Konventionen und Naming einhalten
          - Datenbankmigration sauber mit Versionserhöhung anlegen, falls nötig
          - UI-Anpassungen gemäss Aufgabenstellung umsetzen
          - Bestehende Logik wiederverwenden, wo sinnvoll, statt neu zu implementieren
          - Generierte Dateien (database.g.dart, .mocks.dart) via dart run build_runner build --delete-conflicting-outputs neu generieren. Nur falls das aus Berechtigungsgründen nicht möglich ist und die Datei von Hand angepasst werden musste, dies explizit als Reviewer-Warnung im PR-Beschrieb vermerken
          - Unit-Tests ergänzen/aktualisieren, sofern im Projekt vorhanden
          - Reihenfolge bei Testläufen: Nach flutter analyze zuerst alle bisherigen Änderungen (Konfliktlösung, Formatierung, Feature-Code) committen und pushen, bevor die volle Testsuite (flutter test, alle Shards) gestartet wird
          - Nach Abschluss der Änderungen zwingend selbst prüfen: flutter pub get, flutter analyze (muss fehlerfrei durchlaufen) und flutter test --reporter expanded (alle Shards). Bei einem Fehlschlag den betroffenen Test konkret benennen und beheben, bevor abgeschlossen wird. Falls ein Befehl aus Tool-Berechtigungsgründen nicht ausgeführt werden kann, dies explizit im Abschlusskommentar melden
          - Falls dieser PR später zum Upstream (${UPSTREAM_REPO}) hochgestreamt wird:
            a) .github/workflows/claude.yml ist reine Fork-Automatisierung und wird vor dem finalen Push per git rm entfernt, dies im PR-Beschrieb erwähnen
            b) CLAUDE.md NICHT pauschal entfernen - vor dem finalen Push prüfen: git diff upstream/main -- CLAUDE.md. Kein Diff -> Datei unverändert belassen. Diff vorhanden -> im PR-Beschrieb begründen
            c) Vor dem Öffnen des Upstream-PRs prüfen: gh pr view <N> --json files -q '.files[] | select(.deletions > 0)'
          - Erst wenn Analyse und Tests fehlerfrei durchlaufen (oder das Berechtigungsproblem klar gemeldet wurde), Abschlusskommentar posten: "Fertig - Analyse und Tests laufen fehlerfrei durch, bereit zur Prüfung."
          PRBODY_EOF

          PR_URL=$(gh pr create --repo "$FORK_REPO" --base main --head "${{ steps.branch.outputs.branch }}" \
            --title "$TITEL_KURZ (Original: ${UPSTREAM_REPO}#${NUM})" \
            --body-file /tmp/pr_body.md)
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      # --- Ast 7: Issue-Rewrite ERST NACH erfolgreicher PR-Erstellung, nicht davor ---
      - name: Fork-Issue-Titel/Beschreibung aktualisieren
        if: steps.idempotenz.outputs.weiter == 'true' && steps.extraktion.outputs.weiter == 'true' && steps.upstream.outputs.weiter == 'true'
        run: |
          RESULT='${{ steps.paraphrase.outputs.structured_output }}'
          TITEL_KURZ=$(echo "$RESULT" | jq -r '.titel')
          AUFGABE=$(echo "$RESULT" | jq -r '.aufgabe')
          KONTEXT=$(echo "$RESULT" | jq -r '.kontext')
          NUM="${{ steps.extraktion.outputs.upstream_num }}"
          TITLE="${{ steps.upstream.outputs.title }}"

          gh issue edit "$ISSUE_NUM" --repo "$FORK_REPO" \
            --title "$TITEL_KURZ (Original: ${UPSTREAM_REPO}#${NUM})" \
            --body "**Original-Issue:** ${TITLE} [${UPSTREAM_REPO}#${NUM}]

          **Aufgabe:**
          ${AUFGABE}

          **Kontext:**
          ${KONTEXT}

          **Fork-PR:** ${{ steps.pr.outputs.pr_url }}"

          gh issue edit "$ISSUE_NUM" --repo "$FORK_REPO" --remove-label "auto-pruefen"
